name: unified-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System tools (ffmpeg for P3.F finishing tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install every package from its own lockfile
        run: npm run setup
      - name: Doctor (VERIFY checks must pass; PRODUCTION extras may be missing)
        run: npm run doctor
      - name: Full verification (known B legacy failures locked by name)
        run: npm run verify
      - name: Upload raw test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-current
          path: verification/current/
          if-no-files-found: ignore
